spring.application.name=facilitalab

# ── Perfil ativo ─────────────────────────────────────────────
spring.profiles.active=dev

# ── Banco de dados ──────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/facilitalab_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username  → definido em application-dev.properties
# spring.datasource.password  → definido em application-dev.properties

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Upload de arquivos ───────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# ── E-mail (notificações) ────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.username  → definido em application-dev.properties
# spring.mail.password  → definido em application-dev.properties

# ── Servidor ─────────────────────────────────────────────────
server.port=8081
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# ── JWT ──────────────────────────────────────────────────────
# jwt.secret     → definido em application-dev.properties
# jwt.expiration → definido em application-dev.properties

# ── Exclusões de autoconfiguração ────────────────────────────
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
